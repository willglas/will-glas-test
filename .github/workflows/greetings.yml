name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
          👋 Thanks for opening your first issue! We appreciate your contribution to this project.
          Please make sure you've provided all the necessary information and we'll get back to you as soon as possible.
        pr-message: |
          🎉 Thanks for opening your first pull request! We're excited to review your contribution.
          Please make sure all checks pass and that you've followed our contributing guidelines.
